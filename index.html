<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Wedding Invitation</title>
  <meta name="description" content="You are invited to our wedding" />
  <!-- Preview card when the link is shared on WhatsApp. Change the image to your own after deploying. -->
  <meta property="og:title" content="You're invited to our wedding" />
  <meta property="og:description" content="Join us for the celebrations" />
  <meta property="og:image" content="https://lalith-sagar-devagudi.github.io/The-Wedding/images/hero.svg" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Italiana&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. Hero -->
  <header class="hero" id="hero">
    <div class="hero-bg" id="heroBg"></div>
    <canvas id="petals" aria-hidden="true"></canvas>
    <div class="hero-content">
      <h1 class="hero-title"><span id="heroGroom"></span> <em>weds</em> <span id="heroBride"></span></h1>
      <p class="hero-date" id="heroDate"></p>
    </div>
    <a href="#invite" class="scroll-cue" aria-label="Scroll to the invitation"><span></span></a>
  </header>

  <!-- 2. Story picture -->
  <section class="story" id="story" aria-label="Photo">
    <div class="story-img" id="storyImg"></div>
    <p class="story-caption" id="storyCaption"></p>
  </section>

  <!-- 3. Invitation on parchment -->
  <section class="parchment gold" id="invite">
    <div class="invite">
      <p class="small" id="hostLine"></p>
      <h2 class="caps">Invite</h2>
      <p class="lead" id="inviteLine"></p>
      <p class="names"><span id="nameGroom"></span><span class="amp">&amp;</span><span id="nameBride"></span></p>
      <div class="parents">
        <p id="groomParents"></p>
        <p id="brideParents"></p>
      </div>
      <div class="countdown" id="countdown" aria-live="polite"></div>
    </div>

    <!-- 4. Events -->
    <div class="events-wrap">
      <p class="lead">On the following events</p>
      <div class="events" id="events"></div>
    </div>
  </section>

  <!-- 5. Route -->
  <section class="parchment gold-to-silver" id="route">
    <h2 class="caps">See the route</h2>
    <p class="lead" id="venueText"></p>
    <div class="map-frame"><iframe id="map" title="Venue map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    <a class="btn" id="mapBtn" target="_blank" rel="noopener">Open in Google Maps</a>
  </section>

  <!-- 6. Gallery -->
  <section class="parchment silver" id="gallery">
    <div class="silver-frame">
      <div class="slides" id="slides"></div>
    </div>
    <div class="dots" id="dots" role="tablist" aria-label="Choose photo"></div>
  </section>

  <!-- 7. RSVP -->
  <section class="parchment silver" id="rsvp">
    <h2 class="caps">Please RSVP</h2>
    <p class="lead">Tap to message us on WhatsApp</p>
    <a class="ring" id="rsvpBtn" target="_blank" rel="noopener" aria-label="RSVP on WhatsApp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.6 14.1c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1a17 17 0 0 1-1.7-.6 13.5 13.5 0 0 1-5.2-4.6c-.4-.5-1-1.5-1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.7 1.2 1.6 2a7.3 7.3 0 0 0 2.3 1.4c.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.1.1.7-.1 1.3Z"/></svg>
    </a>
  </section>

  <!-- 8. Things to know -->
  <section class="parchment wood" id="know">
    <h2 class="caps">Things to know</h2>
    <p class="lead">A few details to help you enjoy every moment of the celebrations.</p>
    <dl class="know" id="knowList"></dl>
  </section>

  <!-- 9. Instagram -->
  <section class="parchment wood" id="insta">
    <h2 class="caps">Follow along</h2>
    <p class="lead">Share your photos with <strong id="hashtag"></strong></p>
    <a class="ring" id="instaBtn" target="_blank" rel="noopener" aria-label="Open our Instagram">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 8.2a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4ZM17.3 5.5a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4ZM12 3.8c2.7 0 3 0 4 .1 2.7.1 4 1.4 4.1 4.1.1 1 .1 1.4.1 4s0 3-.1 4c-.1 2.7-1.4 4-4.1 4.1-1 .1-1.4.1-4 .1s-3 0-4-.1c-2.8-.1-4-1.4-4.1-4.1-.1-1-.1-1.4-.1-4s0-3 .1-4C4 5.3 5.3 4 8 3.9c1-.1 1.4-.1 4-.1ZM12 2c-2.7 0-3.1 0-4.1.1C4.2 2.2 2.2 4.2 2.1 7.9 2 8.9 2 9.3 2 12s0 3.1.1 4.1c.1 3.7 2.1 5.7 5.8 5.8 1 .1 1.4.1 4.1.1s3.1 0 4.1-.1c3.7-.1 5.7-2.1 5.8-5.8.1-1 .1-1.4.1-4.1s0-3.1-.1-4.1c-.1-3.7-2.1-5.7-5.8-5.8C15.1 2 14.7 2 12 2Z"/></svg>
    </a>
  </section>

  <!-- 10. Closing -->
  <footer class="closing" id="closing">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div class="closing-img" id="closingImg"></div>
    <div class="closing-text">
      <p class="lead">With love and blessings</p>
      <p class="names small-names"><span id="closeGroom"></span> <span class="amp">&amp;</span> <span id="closeBride"></span></p>
    </div>
  </footer>

  <button class="music-btn" id="musicBtn" hidden aria-label="Play music">♪</button>
  <audio id="music" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
